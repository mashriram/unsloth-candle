[package]
name = "unsloth-candle"
version = "0.1.0"
edition = "2021"
authors = ["Unsloth Team <team@unsloth.ai>", "Antigravity <antigravity@google.com>"]
description = "High-performance LLM fine-tuning library built with Candle and Rust."
license = "Apache-2.0"
repository = "https://github.com/unslothai/unsloth-candle"
readme = "README.md"
keywords = ["llm", "finetuning", "lora", "qlora", "candle", "transformers"]
categories = ["science", "emulators", "multimedia::video"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "unsloth_candle"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module"] }
candle-core = { version = "0.8.2" }
candle-nn = { version = "0.8.2", features = [] }
candle-transformers = { version = "0.8.2" }
cudarc = { version = "0.13.0", optional = true }
half = "2.4.1"
thiserror = "2.0.11"
safetensors = "0.5.2"
tokio = { version = "1.32.0", features = ["full"] } # For async downloading if needed
hf-hub = { version = "0.3.2", features = ["tokio"] } # For downloading weights
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-flash-attn = { version = "0.8.2", optional = true }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "dep:cudarc"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
flash-attn = ["cuda"]

[build-dependencies]
# For potential PTX compilation or embedding
